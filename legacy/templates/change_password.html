{% extends "base.html" %}

{% block title %}Passwort ändern – SAJF Strategies{% endblock %}

{% block extra_css %}
<style>
    .auth-wrapper {
        min-height: calc(100vh - 56px - 160px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-3xl) var(--space-lg);
    }
    .auth-card {
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--space-2xl);
    }
    .auth-header {
        text-align: center;
        margin-bottom: var(--space-xl);
    }
    .auth-logo {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--text-primary);
        margin-bottom: var(--space-md);
    }
    .auth-header h1 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 4px;
        letter-spacing: -0.02em;
    }
    .auth-header p {
        color: var(--text-secondary);
        font-size: 0.88rem;
    }
    .auth-form-group {
        margin-bottom: var(--space-md);
    }
    .auth-label {
        display: block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 6px;
        color: var(--text-primary);
    }
    .auth-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 0.88rem;
        font-family: inherit;
        transition: border-color 150ms ease;
        background: var(--background);
        color: var(--text-primary);
    }
    .auth-input::placeholder { color: var(--text-muted); }
    .auth-input:focus {
        outline: none;
        border-color: var(--accent);
    }
    .pw-strength {
        height: 3px;
        border-radius: 2px;
        background: var(--border);
        margin-top: 6px;
        overflow: hidden;
    }
    .pw-strength-bar {
        height: 100%;
        border-radius: 2px;
        width: 0%;
        transition: all 0.3s;
    }
    .pw-strength-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.6rem;
        margin-top: 4px;
        font-weight: 600;
    }
    .auth-submit {
        width: 100%;
        margin-top: var(--space-sm);
    }
    .auth-footer {
        text-align: center;
        margin-top: var(--space-lg);
        font-size: 0.84rem;
    }
    .auth-footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }
    .msg-error {
        background: var(--danger-light);
        color: var(--danger);
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        font-size: 0.84rem;
        margin-bottom: var(--space-md);
        border: 1px solid var(--danger);
    }
    .msg-success {
        background: var(--success-light);
        color: var(--success);
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        font-size: 0.84rem;
        margin-bottom: var(--space-md);
        border: 1px solid var(--success);
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">SAJF</div>
            <h1>Passwort ändern</h1>
            <p>Geben Sie Ihr aktuelles und neues Passwort ein</p>
        </div>

        <div id="message-container"></div>

        <div>
            <div class="auth-form-group">
                <label class="auth-label">Aktuelles Passwort</label>
                <input type="password" id="current_password" class="auth-input" required
                       placeholder="Aktuelles Passwort" autocomplete="current-password">
            </div>

            <div class="auth-form-group">
                <label class="auth-label">Neues Passwort</label>
                <input type="password" id="new_password" class="auth-input" required
                       placeholder="Min. 6 Zeichen" autocomplete="new-password"
                       oninput="checkStrength(this.value)">
                <div class="pw-strength"><div class="pw-strength-bar" id="strength-bar"></div></div>
                <div class="pw-strength-text" id="strength-text"></div>
            </div>

            <div class="auth-form-group">
                <label class="auth-label">Neues Passwort bestätigen</label>
                <input type="password" id="confirm_password" class="auth-input" required
                       placeholder="Passwort wiederholen" autocomplete="new-password">
            </div>

            <button type="button" class="btn btn-primary auth-submit" id="submit-btn" onclick="handleChangePassword()">
                Passwort ändern
            </button>
        </div>

        <div class="auth-footer">
            <a href="/publications">Zurück zu Ausschreibungen</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var submitBtn = document.getElementById('submit-btn');
    var messageContainer = document.getElementById('message-container');

    document.getElementById('confirm_password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleChangePassword();
    });

    function checkStrength(pw) {
        var bar = document.getElementById('strength-bar');
        var text = document.getElementById('strength-text');
        var score = 0;

        if (pw.length >= 6) score++;
        if (pw.length >= 10) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;

        var levels = [
            { width: '0%', color: 'var(--border)', label: '' },
            { width: '20%', color: 'var(--danger)', label: 'Sehr schwach' },
            { width: '40%', color: 'var(--warning)', label: 'Schwach' },
            { width: '60%', color: 'var(--warning)', label: 'Mittel' },
            { width: '80%', color: 'var(--success)', label: 'Stark' },
            { width: '100%', color: 'var(--accent)', label: 'Sehr stark' }
        ];

        var level = levels[score] || levels[0];
        bar.style.width = level.width;
        bar.style.background = level.color;
        text.textContent = level.label;
        text.style.color = level.color;
    }

    function handleChangePassword() {
        var currentPw = document.getElementById('current_password').value;
        var newPw = document.getElementById('new_password').value;
        var confirmPw = document.getElementById('confirm_password').value;

        if (!currentPw || !newPw || !confirmPw) {
            showMessage('Bitte füllen Sie alle Felder aus.', 'error');
            return;
        }

        if (newPw.length < 6) {
            showMessage('Das neue Passwort muss mindestens 6 Zeichen lang sein.', 'error');
            return;
        }

        if (newPw !== confirmPw) {
            showMessage('Die Passwörter stimmen nicht überein.', 'error');
            return;
        }

        if (newPw === currentPw) {
            showMessage('Das neue Passwort muss sich vom aktuellen unterscheiden.', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Wird geändert...';

        fetch('/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                current_password: currentPw,
                new_password: newPw
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.success) {
                showMessage('Passwort erfolgreich geändert!', 'success');
                document.getElementById('current_password').value = '';
                document.getElementById('new_password').value = '';
                document.getElementById('confirm_password').value = '';
                checkStrength('');
            } else {
                showMessage(data.error || 'Passwort ändern fehlgeschlagen.', 'error');
            }
            submitBtn.disabled = false;
            submitBtn.textContent = 'Passwort ändern';
        })
        .catch(function(e) {
            showMessage('Verbindungsfehler. Bitte erneut versuchen.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Passwort ändern';
        });
    }

    function showMessage(msg, type) {
        messageContainer.textContent = '';
        var el = document.createElement('div');
        el.className = 'msg-' + type;
        el.textContent = msg;
        messageContainer.appendChild(el);
    }
</script>
{% endblock %}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: simap_ui/requirements.txt
      # Bewusst nur die Web-Runtime (ohne torch): die Tests mocken die
      # Datenschicht und embeddings.text_builder/dicts sind stdlib-only.
      - run: pip install -r simap_ui/requirements.txt pytest
      - run: pytest -q
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-dummy-key
          SECRET_KEY: ci-dummy-secret

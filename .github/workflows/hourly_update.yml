name: Hourly SIMAP Update

on:
  schedule:
    # Läuft jede Stunde zur 15. Minute (z.B. 08:15, 09:15, ...)
    - cron: '15 * * * *'
  workflow_dispatch:
    # Ermöglicht manuellen Start via GitHub UI mit Eingabe
    inputs:
      days_back:
        description: 'Anzahl Tage zurück'
        required: true
        default: '2'
        type: string

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'  # Cache pip dependencies
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Check DATABASE_URL Secret
      run: |
        if [ -z "${{ secrets.DATABASE_URL }}" ]; then
          echo "::error::DATABASE_URL Secret ist nicht gesetzt!"
          echo "Bitte gehe zu: Settings → Secrets and variables → Actions"
          echo "und füge DATABASE_URL als Secret hinzu."
          exit 1
        else
          echo "✓ DATABASE_URL Secret ist gesetzt"
          # Zeige maskierte URL (ohne Passwort)
          DB_URL="${{ secrets.DATABASE_URL }}"
          if [[ "$DB_URL" == *"@"* ]]; then
            MASKED_URL=$(echo "$DB_URL" | sed 's/:[^@]*@/:***@/')
            echo "Connection String (maskiert): $MASKED_URL"
          fi
        fi
        
    - name: Test Database Connection
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        echo "Teste Datenbankverbindung..."
        python scripts/test_db_connection.py || {
          echo "::error::Datenbankverbindung fehlgeschlagen!"
          echo "Bitte prüfe:"
          echo "1. Ist das Passwort in DATABASE_URL korrekt?"
          echo "2. Verwendest du das 'URI' Format (nicht Connection Pooling)?"
          echo "3. Ist dein Supabase-Projekt aktiv?"
          exit 1
        }
        
    - name: Run SIMAP Update
      id: update
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        # Nutze Input vom manuellen Start, sonst Default '2' (für den automatischen Cron-Job)
        DAYS="${{ inputs.days_back || '2' }}"
        echo "=========================================="
        echo "Starte SIMAP Update für die letzten $DAYS Tage..."
        echo "=========================================="
        echo "days=$DAYS" >> $GITHUB_OUTPUT
        
        # Führe Update aus und speichere Exit-Code
        python scripts/update_db.py --days "$DAYS" 2>&1 | tee update_log.txt
        UPDATE_EXIT_CODE=${PIPESTATUS[0]}
        
        # Prüfe ob CSV erstellt wurde
        if [ -f "data/simap_projects.csv" ]; then
          CSV_LINES=$(wc -l < data/simap_projects.csv)
          echo "CSV-Datei erstellt mit $CSV_LINES Zeilen"
          echo "csv_lines=$CSV_LINES" >> $GITHUB_OUTPUT
        else
          echo "::warning::Keine CSV-Datei erstellt!"
        fi
        
        # Exit mit dem Exit-Code des Python-Skripts
        exit $UPDATE_EXIT_CODE
      
    - name: Check Update Results
      if: always()
      run: |
        echo "=========================================="
        echo "UPDATE ERGEBNISSE"
        echo "=========================================="
        if [ -f "update_log.txt" ]; then
          echo "Log-Ausgabe:"
          cat update_log.txt
          
          # Prüfe auf Erfolgs-Indikatoren
          if grep -q "✓ FERTIG!" update_log.txt; then
            echo ""
            echo "✓ Update erfolgreich abgeschlossen!"
            
            # Extrahiere Statistiken
            if grep -q "Projekte importiert" update_log.txt; then
              grep "Projekte importiert" update_log.txt
            fi
          else
            echo ""
            echo "::warning::Update könnte fehlgeschlagen sein - prüfe Logs"
          fi
        else
          echo "::warning::Keine Log-Datei gefunden"
        fi
        
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: update-logs-${{ github.run_id }}
        path: |
          update_log.txt
          data/*.csv
        retention-days: 7
        
    - name: Create issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = `SIMAP Update fehlgeschlagen - ${new Date().toISOString().split('T')[0]}`;
          const body = `
          ## Workflow fehlgeschlagen
          
          - **Run ID**: ${context.runId}
          - **Tage zurück**: ${{ steps.update.outputs.days || '2' }}
          - **Zeitpunkt**: ${new Date().toISOString()}
          
          Bitte prüfe die [Workflow Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).
          `;
          
          // Prüfe ob ähnliches Issue bereits existiert
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'workflow-failure'
          });
          
          const existingIssue = issues.data.find(i => i.title.includes('SIMAP Update fehlgeschlagen'));
          
          if (!existingIssue) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['workflow-failure', 'automated']
            });
          } else {
            // Kommentar zu bestehendem Issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existingIssue.number,
              body: `Erneuter Fehler am ${new Date().toISOString()}\n\n[Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
          }
          
    - name: Report success
      if: success()
      run: |
        echo "=========================================="
        echo "✓ SIMAP Update erfolgreich abgeschlossen"
        echo "=========================================="
        echo "Tage zurück: ${{ steps.update.outputs.days || '2' }}"
        if [ -n "${{ steps.update.outputs.csv_lines }}" ]; then
          echo "CSV-Zeilen: ${{ steps.update.outputs.csv_lines }}"
        fi

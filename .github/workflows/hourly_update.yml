name: Hourly SIMAP Update

on:
  schedule:
    # Läuft jede Stunde zur 15. Minute (z.B. 08:15, 09:15, ...)
    - cron: '15 * * * *'
  workflow_dispatch:
    # Ermöglicht manuellen Start via GitHub UI mit Eingabe
    inputs:
      days_back:
        description: 'Anzahl Tage zurück'
        required: true
        default: '2'
        type: string

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'  # Cache pip dependencies
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run SIMAP Update
      id: update
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        # Nutze Input vom manuellen Start, sonst Default '2' (für den automatischen Cron-Job)
        DAYS="${{ inputs.days_back || '2' }}"
        echo "Starte Update für die letzten $DAYS Tage..."
        echo "days=$DAYS" >> $GITHUB_OUTPUT
        python scripts/update_db.py --days "$DAYS" 2>&1 | tee update_log.txt
      continue-on-error: true
      
    - name: Check for errors
      if: steps.update.outcome == 'failure'
      run: |
        echo "::error::SIMAP Update fehlgeschlagen!"
        echo "Log-Ausgabe:"
        cat update_log.txt || echo "Keine Log-Datei gefunden"
        
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: update-logs-${{ github.run_id }}
        path: |
          update_log.txt
          data/*.csv
        retention-days: 7
        
    - name: Create issue on failure
      if: steps.update.outcome == 'failure'
      uses: actions/github-script@v7
      with:
        script: |
          const title = `SIMAP Update fehlgeschlagen - ${new Date().toISOString().split('T')[0]}`;
          const body = `
          ## Workflow fehlgeschlagen
          
          - **Run ID**: ${context.runId}
          - **Tage zurück**: ${{ steps.update.outputs.days || '2' }}
          - **Zeitpunkt**: ${new Date().toISOString()}
          
          Bitte prüfe die [Workflow Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).
          `;
          
          // Prüfe ob ähnliches Issue bereits existiert
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'workflow-failure'
          });
          
          const existingIssue = issues.data.find(i => i.title.includes('SIMAP Update fehlgeschlagen'));
          
          if (!existingIssue) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['workflow-failure', 'automated']
            });
          } else {
            // Kommentar zu bestehendem Issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existingIssue.number,
              body: `Erneuter Fehler am ${new Date().toISOString()}\n\n[Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
          }
          
    - name: Report success
      if: steps.update.outcome == 'success'
      run: |
        echo "✓ SIMAP Update erfolgreich abgeschlossen"
        echo "Tage zurück: ${{ steps.update.outputs.days || '2' }}"

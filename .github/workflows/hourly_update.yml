name: Hourly SIMAP Update

on:
  schedule:
    # Läuft jede Stunde zur 15. Minute (z.B. 08:15, 09:15, ...)
    - cron: '15 * * * *'
  workflow_dispatch:
    # Ermöglicht manuellen Start via GitHub UI mit Eingabe
    inputs:
      days_back:
        description: 'Anzahl Tage zurück'
        required: true
        default: '2'
        type: string

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run SIMAP Update
      env:
        # Hier werden die Secrets aus GitHub Settings eingebunden
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        # Nutze Input vom manuellen Start, sonst Default '2' (für den automatischen Cron-Job)
        DAYS="${{ inputs.days_back || '2' }}"
        echo "Starte Update für die letzten $DAYS Tage..."
        python main.py --days "$DAYS"


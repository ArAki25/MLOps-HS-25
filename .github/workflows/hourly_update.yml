name: Hourly SIMAP Update

on:
  schedule:
    # Läuft jede Stunde zur 15. Minute (z.B. 08:15, 09:15, ...)
    - cron: '15 * * * *'
  workflow_dispatch:
    # Ermöglicht manuellen Start via GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run SIMAP Update
      env:
        # Hier werden die Secrets aus GitHub Settings eingebunden
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        # Lädt Daten der letzten 2 Tage (um sicherzugehen, dass nichts verpasst wird)
        # Die Filter (Kantone etc.) sind in main.py definiert
        python main.py --days 2


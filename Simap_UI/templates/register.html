{% extends "base.html" %}

{% block title %}Registrierung - SAJF Strategies{% endblock %}

{% block extra_css %}
<style>
    .register-container {
        max-width: 500px;
        margin: 4rem auto;
        padding: 2rem;
    }

    .register-card {
        background: var(--surface);
        border-radius: 16px;
        padding: 3rem;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
    }

    .register-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .register-icon {
        font-size: 3.5rem;
        margin-bottom: 1rem;
    }

    .register-header h1 {
        font-size: 2rem;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
    }

    .register-header p {
        color: var(--text-secondary);
        font-size: 1rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: var(--text-primary);
    }

    .form-input {
        width: 100%;
        padding: 0.875rem 1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
        background: var(--background);
        color: var(--text-primary);
    }

    .form-input::placeholder {
        color: var(--text-secondary);
    }

    .form-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .btn-register-submit {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, var(--accent), #2563eb);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-register-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .btn-register-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    .register-footer {
        text-align: center;
        margin-top: 2rem;
        font-size: 0.9rem;
        color: var(--text-secondary);
    }

    .register-footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
    }

    .register-footer a:hover {
        text-decoration: underline;
    }

    .error-message {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .success-message {
        background: rgba(16, 185, 129, 0.1);
        color: #10b981;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .password-strength {
        margin-top: 0.5rem;
        font-size: 0.85rem;
    }

    .strength-weak {
        color: #ef4444;
    }

    .strength-medium {
        color: #f59e0b;
    }

    .strength-strong {
        color: #10b981;
    }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <div class="register-icon">🚀</div>
            <h1>Jetzt registrieren</h1>
            <p>Erstellen Sie Ihr kostenloses Konto</p>
        </div>

        <div id="message-container"></div>

        <form id="register-form">
            <div class="form-group">
                <label class="form-label">E-Mail-Adresse</label>
                <input type="email" id="email" class="form-input" required 
                       placeholder="ihre.email@example.com">
            </div>

            <div class="form-group">
                <label class="form-label">Firmenname</label>
                <input type="text" id="company" class="form-input" required 
                       placeholder="Ihre Firma AG">
            </div>

            <div class="form-group">
                <label class="form-label">Passwort</label>
                <input type="password" id="password" class="form-input" required 
                       placeholder="••••••••" minlength="6">
                <div id="password-strength" class="password-strength"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Passwort bestätigen</label>
                <input type="password" id="password-confirm" class="form-input" required 
                       placeholder="••••••••" minlength="6">
            </div>

            <button type="submit" class="btn-register-submit" id="submit-btn">
                Konto erstellen
            </button>
        </form>

        <div class="register-footer">
            <p>Bereits ein Konto? <a href="/login">Jetzt anmelden</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('submit-btn');
    const messageContainer = document.getElementById('message-container');
    const passwordInput = document.getElementById('password');
    const passwordStrength = document.getElementById('password-strength');

    // Password strength indicator
    passwordInput.addEventListener('input', () => {
        const password = passwordInput.value;
        let strength = '';
        let className = '';

        if (password.length === 0) {
            passwordStrength.textContent = '';
            return;
        }

        if (password.length < 6) {
            strength = 'Zu kurz (mindestens 6 Zeichen)';
            className = 'strength-weak';
        } else if (password.length < 8) {
            strength = 'Schwach';
            className = 'strength-weak';
        } else if (password.match(/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$/)) {
            strength = 'Stark';
            className = 'strength-strong';
        } else {
            strength = 'Mittel';
            className = 'strength-medium';
        }

        passwordStrength.textContent = `Passwortstärke: ${strength}`;
        passwordStrength.className = `password-strength ${className}`;
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const company = document.getElementById('company').value;
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('password-confirm').value;

        // Validation
        if (password !== passwordConfirm) {
            showMessage('Die Passwörter stimmen nicht überein.', 'error');
            return;
        }

        if (password.length < 6) {
            showMessage('Das Passwort muss mindestens 6 Zeichen lang sein.', 'error');
            return;
        }

        // Disable button
        submitBtn.disabled = true;
        submitBtn.textContent = 'Registrierung läuft...';

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email,
                    password,
                    company_name: company
                })
            });

            const data = await response.json();

            if (data.success) {
                showMessage('Registrierung erfolgreich! Bitte bestätigen Sie Ihre E-Mail-Adresse.', 'success');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                showMessage(data.error || 'Registrierung fehlgeschlagen. Bitte versuchen Sie es erneut.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Konto erstellen';
            }
        } catch (error) {
            console.error('Error:', error);
            showMessage('Ein Fehler ist aufgetreten. Bitte versuchen Sie es später erneut.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Konto erstellen';
        }
    });

    function showMessage(message, type) {
        const className = type === 'error' ? 'error-message' : 'success-message';
        messageContainer.innerHTML = `<div class="${className}">${message}</div>`;
    }
</script>
{% endblock %}

<script>
        // ============================================
        // STATE
        // ============================================
        let allProjects = [];
        let favoriteIds = [];
        const activeFilterState = {
            canton: [],
            orderType: [],
            processType: [],
            pubType: []
        };

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadProjects();
            loadFilterOptions();
            loadFavorites();
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.filter-btn') && !e.target.closest('.filter-dropdown')) {
                document.querySelectorAll('.filter-dropdown').forEach(d => d.classList.remove('show'));
            }
            if (!e.target.closest('.user-avatar') && !e.target.closest('.user-dropdown')) {
                document.getElementById('userDropdown').classList.remove('show');
            }
            if (!e.target.closest('.menu-dots') && !e.target.closest('.bookmark-menu')) {
                document.querySelectorAll('.bookmark-menu').forEach(m => m.classList.remove('show'));
            }
        });

        function toggleUserMenu() {
            document.getElementById('userDropdown').classList.toggle('show');
        }

        // ============================================
        // LOAD DATA
        // ============================================
        async function loadProjects() {
            try {
                const res = await fetch('/api/projects?limit=500');
                allProjects = await res.json();
                renderProjects(allProjects);
            } catch (e) {
                document.getElementById('pubList').innerHTML = '<div class="empty">❌ Fehler beim Laden</div>';
            }
        }

        async function loadFavorites() {
            try {
                const res = await fetch('/api/favorites');
                const data = await res.json();
                favoriteIds = data.favorites || [];
            } catch (e) { favoriteIds = []; }
        }

        async function loadFilterOptions() {
            try {
                const res = await fetch('/api/cantons');
                const cantons = await res.json();
                document.getElementById('cantonList').innerHTML = cantons.map(c =>
                    `<label><input type="checkbox" value="${c.code}" onchange="onFilterChange('canton')"> ${c.code} (${c.count})</label>`
                ).join('');
            } catch (e) {}

            try {
                const res = await fetch('/api/order_types');
                const types = await res.json();
                document.getElementById('orderTypeList').innerHTML = types.map(t =>
                    `<label><input type="checkbox" value="${t}" onchange="onFilterChange('orderType')"> ${formatLabel(t)}</label>`
                ).join('');
            } catch (e) {}

            try {
                const res = await fetch('/api/process_types');
                const types = await res.json();
                document.getElementById('processTypeList').innerHTML = types.map(t =>
                    `<label><input type="checkbox" value="${t}" onchange="onFilterChange('processType')"> ${formatLabel(t)}</label>`
                ).join('');
            } catch (e) {}

            const pubTypes = ['award', 'advance_notice', 'abandonment'];
            const pubLabels = { 'award': 'Zuschlag', 'advance_notice': 'Ausschreibung', 'abandonment': 'Abbruch' };
            document.getElementById('pubTypeList').innerHTML = pubTypes.map(t =>
                `<label><input type="checkbox" value="${t}" onchange="onFilterChange('pubType')"> ${pubLabels[t] || t}</label>`
            ).join('');
        }

        // ============================================
        // SEARCH & FILTER
        // ============================================
        async function doSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const params = buildFilterParams();
            if (query) params.set('search', query);

            document.getElementById('pubList').innerHTML = '<div class="loading"><div class="spinner"></div>Suche läuft...</div>';

            try {
                const res = await fetch('/api/filter?' + params.toString());
                const data = await res.json();
                allProjects = data;
                renderProjects(data);
            } catch (e) {
                document.getElementById('pubList').innerHTML = '<div class="empty">❌ Fehler bei der Suche</div>';
            }
        }

        function buildFilterParams() {
            const params = new URLSearchParams();
            if (activeFilterState.canton.length) params.set('canton', activeFilterState.canton[0]);
            if (activeFilterState.orderType.length) params.set('order_type', activeFilterState.orderType[0]);
            if (activeFilterState.processType.length) params.set('process_type', activeFilterState.processType[0]);
            if (activeFilterState.pubType.length) params.set('pub_type', activeFilterState.pubType[0]);
            return params;
        }

        function onFilterChange(filterType) {
            const mapping = {
                'canton': 'cantonDropdown',
                'orderType': 'orderTypeDropdown',
                'processType': 'processTypeDropdown',
                'pubType': 'pubTypeDropdown'
            };
            const dropdown = document.getElementById(mapping[filterType]);
            const checked = dropdown.querySelectorAll('input[type="checkbox"]:checked');
            activeFilterState[filterType] = Array.from(checked).map(c => c.value);

            const badge = document.getElementById(filterType + 'Badge');
            const btnId = 'filter' + filterType.charAt(0).toUpperCase() + filterType.slice(1);
            const btn = document.getElementById(btnId);
            if (activeFilterState[filterType].length > 0) {
                badge.textContent = activeFilterState[filterType].length;
                badge.style.display = 'inline';
                btn.classList.add('active');
            } else {
                badge.style.display = 'none';
                btn.classList.remove('active');
            }

            renderActiveFilters();
            doSearch();
        }

        function renderActiveFilters() {
            const container = document.getElementById('activeFilters');
            const pubLabels = { 'award': 'Zuschlag', 'advance_notice': 'Ausschreibung', 'abandonment': 'Abbruch' };
            let html = '';
            let hasAny = false;

            for (const [key, values] of Object.entries(activeFilterState)) {
                values.forEach(v => {
                    hasAny = true;
                    const label = key === 'pubType' ? (pubLabels[v] || v) : formatLabel(v);
                    html += `<span class="active-filter-tag">${label} <button onclick="removeFilter('${key}','${v}')">×</button></span>`;
                });
            }
            if (hasAny) {
                html += `<button class="clear-all" onclick="clearAllFilters()">Alle löschen</button>`;
            }
            container.innerHTML = html;
        }

        function removeFilter(filterType, value) {
            const mapping = {
                'canton': 'cantonDropdown',
                'orderType': 'orderTypeDropdown',
                'processType': 'processTypeDropdown',
                'pubType': 'pubTypeDropdown'
            };
            const dropdown = document.getElementById(mapping[filterType]);
            const cb = dropdown.querySelector(`input[value="${value}"]`);
            if (cb) cb.checked = false;
            onFilterChange(filterType);
        }

        function clearAllFilters() {
            document.querySelectorAll('.filter-dropdown input[type="checkbox"]').forEach(cb => cb.checked = false);
            ['canton', 'orderType', 'processType', 'pubType'].forEach(f => {
                activeFilterState[f] = [];
                document.getElementById(f + 'Badge').style.display = 'none';
                const btnId = 'filter' + f.charAt(0).toUpperCase() + f.slice(1);
                document.getElementById(btnId).classList.remove('active');
            });
            renderActiveFilters();
            doSearch();
        }

        // ============================================
        // FILTER DROPDOWN TOGGLE
        // ============================================
        function toggleFilter(type) {
            const mapping = {
                'canton': 'cantonDropdown',
                'orderType': 'orderTypeDropdown',
                'processType': 'processTypeDropdown',
                'pubType': 'pubTypeDropdown'
            };
            const target = document.getElementById(mapping[type]);
            const isOpen = target.classList.contains('show');
            document.querySelectorAll('.filter-dropdown').forEach(d => d.classList.remove('show'));
            if (!isOpen) target.classList.add('show');
        }

        function filterDropdownItems(type, query) {
            const mapping = { 'canton': 'cantonList' };
            const list = document.getElementById(mapping[type]);
            if (!list) return;
            list.querySelectorAll('label').forEach(l => {
                l.style.display = l.textContent.toLowerCase().includes(query.toLowerCase()) ? '' : 'none';
            });
        }

        // ============================================
        // RENDER
        // ============================================
        function renderProjects(projects) {
            const container = document.getElementById('pubList');
            document.getElementById('resultsCount').textContent = `${projects.length} Ergebnisse`;

            if (!projects.length) {
                container.innerHTML = '<div class="empty">Keine Ausschreibungen gefunden.</div>';
                return;
            }

            const pubLabels = { 'award': 'Zuschlag', 'advance_notice': 'Ausschreibung', 'abandonment': 'Abbruch' };
            container.innerHTML = projects.map((p, i) => {
                const isFav = favoriteIds.includes(String(p.id));
                const location = [p.city, p.canton].filter(Boolean).join(', ');
                const typeLabel = pubLabels[p.pub_type] || p.pub_type || '';

                return `
                <div class="pub-row" onclick="window.open('${p.simap_url}', '_blank')">
                    <div>
                        <div class="pub-title">${escapeHtml(p.title)}</div>
                        <div class="pub-location">${escapeHtml(location)}</div>
                        <div class="pub-tags">
                            ${p.canton ? `<span class="tag">${p.canton}</span>` : ''}
                            ${p.order_type ? `<span class="tag">${formatLabel(p.order_type)}</span>` : ''}
                            ${p.cpv_code ? `<span class="tag">CPV: ${p.cpv_code}</span>` : ''}
                            ${p.simap_id ? `<span class="tag">ID: ${p.simap_id}</span>` : ''}
                        </div>
                    </div>
                    <div class="pub-org">${escapeHtml(p.organization)}</div>
                    <div class="pub-meta">
                        <div class="pub-type">${typeLabel}</div>
                        <div class="pub-time">${p.time_ago}</div>
                    </div>
                    <div class="pub-menu" style="position:relative;">
                        <button class="menu-dots" onclick="event.stopPropagation(); toggleBookmark(${i})" title="${isFav ? 'Entfernen' : 'Merken'}">
                            ${isFav ? '⭐' : '☆'}
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        // ============================================
        // FAVORITES
        // ============================================
        async function toggleBookmark(index) {
            const p = allProjects[index];
            if (!p) return;
            const pid = String(p.id);
            const isFav = favoriteIds.includes(pid);

            try {
                if (isFav) {
                    await fetch('/api/favorites/remove', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ project_id: p.id })
                    });
                    favoriteIds = favoriteIds.filter(id => id !== pid);
                } else {
                    await fetch('/api/favorites/add', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            project_id: p.id, title: p.title,
                            canton: p.canton, description: p.description,
                            simap_url: p.simap_url
                        })
                    });
                    favoriteIds.push(pid);
                }
                renderProjects(allProjects);
            } catch (e) { console.error('Favorite error:', e); }
        }

        // ============================================
        // HELPERS
        // ============================================
        function formatLabel(str) {
            if (!str) return '';
            return str.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>

{% extends "base.html" %}

{% block title %}Pro Login - SAJF Strategies{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        max-width: 400px;
        margin: 4rem auto;
        padding: 2rem;
    }

    .login-card {
        background: var(--surface);
        border-radius: 16px;
        padding: 2.5rem;
        box-shadow: var(--shadow-lg);
    }

    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .login-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
    }

    .login-header h1 {
        font-size: 1.5rem;
        color: var(--primary);
        margin-bottom: 0.5rem;
    }

    .login-header p {
        color: var(--text-secondary);
        font-size: 0.875rem;
    }

    .form-group {
        margin-bottom: 1.25rem;
    }

    .form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: var(--text-primary);
    }

    .form-input {
        width: 100%;
        padding: 0.875rem 1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(15, 52, 96, 0.1);
    }

    .btn-login-submit {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, var(--highlight), #ff6b6b);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-login-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
    }

    .login-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.875rem;
        color: var(--text-secondary);
    }

    .login-footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
    }

    .error-message {
        background: #fef2f2;
        color: #dc2626;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 0.875rem;
        margin-bottom: 1rem;
    }

    .pro-badge {
        display: inline-block;
        background: linear-gradient(135deg, var(--highlight), #ff6b6b);
        color: white;
        padding: 0.25rem 0.75rem;
        border-radius: 50px;
        font-size: 0.75rem;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🔐</div>
            <h1>Pro Login</h1>
            <p>Exklusiver Zugang für Pro-Nutzer</p>
            <span class="pro-badge">PRO</span>
        </div>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Firmenname oder E-Mail</label>
                <input type="text" name="username" class="form-input" required placeholder="firma@example.com">
            </div>

            <div class="form-group">
                <label class="form-label">Passwort</label>
                <input type="password" name="password" class="form-input" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-login-submit">Anmelden</button>
        </form>

        <div class="login-footer">
            <p>Noch kein Pro-Konto?</p>
            <a href="/pro">Pro Version entdecken →</a>
        </div>
    </div>
</div>
{% endblock %}

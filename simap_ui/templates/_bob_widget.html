<div class="bob-bubble" id="bob-bubble">
    <div class="bob-panel" id="bob-panel" role="dialog" aria-label="Chat mit Bob">
        <div class="bob-header">
            <div class="bob-avatar" aria-hidden="true">B</div>
            <div class="bob-header-info">
                <div class="bob-header-name">Bob</div>
                <div class="bob-header-status" data-i18n="bob_status">Online</div>
            </div>
        </div>
        <div class="bob-messages" id="bob-messages" role="log" aria-live="polite" aria-label="Chatverlauf">
            <div class="bob-msg bot" data-i18n="bob_greeting">Hallo! Ich bin Bob, Ihr Assistent bei SAJF Strategies. Ich helfe Ihnen gerne bei Fragen zu öffentlichen Ausschreibungen oder zur Plattform.</div>
        </div>
        <div class="bob-typing" id="bob-typing" role="status" aria-live="polite" aria-label="Bob schreibt">
            <span></span><span></span><span></span>
        </div>
        <div class="bob-input-row">
            <textarea class="bob-input" id="bob-input" placeholder="Ihre Frage..." data-i18n-placeholder="bob_placeholder" rows="1"
                      aria-label="Nachricht an Bob" autocomplete="off"
                      onkeydown="bobKeydown(event)" oninput="bobAutoResize(this)"></textarea>
            <button class="bob-send" id="bob-send" onclick="bobSend()" title="Senden" aria-label="Nachricht senden">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
                    <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>
    </div>
    <button class="bob-trigger" id="bob-trigger" onclick="bobToggle()" title="Chat mit Bob"
            aria-label="Chat mit Bob öffnen" aria-expanded="false" aria-controls="bob-panel">
        <svg class="bob-icon-chat" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <svg class="bob-icon-close" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
    </button>
</div>

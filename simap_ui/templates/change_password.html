{% extends "base.html" %}

{% block title %}Passwort ändern – SAJF Strategies{% endblock %}

{% block extra_css %}
<style>
    .login-wrapper {
        min-height: calc(100vh - 64px - 200px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        background: var(--background);
    }

    .login-card {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        padding: 2.5rem;
        box-shadow: var(--shadow-lg);
    }

    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .login-logo {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
    }

    .login-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 0.375rem;
        letter-spacing: -0.02em;
    }

    .login-header p {
        color: var(--text-secondary);
        font-size: 0.9375rem;
    }

    .form-group {
        margin-bottom: 1.25rem;
    }

    .form-label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 600;
        margin-bottom: 0.375rem;
        color: var(--text-primary);
    }

    .form-input {
        width: 100%;
        padding: 0.75rem 0.875rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 0.9375rem;
        font-family: inherit;
        transition: border-color 0.15s, box-shadow 0.15s;
        background: var(--background);
        color: var(--text-primary);
    }

    .form-input::placeholder { color: var(--text-muted); }

    .form-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        background: var(--surface);
    }

    .pw-strength {
        height: 4px;
        border-radius: 2px;
        background: var(--border);
        margin-top: 0.5rem;
        overflow: hidden;
    }

    .pw-strength-bar {
        height: 100%;
        border-radius: 2px;
        width: 0%;
        transition: all 0.3s;
    }

    .pw-strength-text {
        font-size: 0.6875rem;
        margin-top: 0.25rem;
        font-weight: 600;
    }

    .btn-submit {
        width: 100%;
        padding: 0.875rem;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: var(--radius);
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.15s;
        margin-top: 0.5rem;
    }

    .btn-submit:hover {
        background: var(--accent-hover);
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .msg-error {
        background: rgba(239,68,68,.1);
        color: #ef4444;
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        font-size: 0.875rem;
        margin-bottom: 1.25rem;
        border: 1px solid rgba(239,68,68,.2);
    }

    .msg-success {
        background: rgba(16,185,129,.1);
        color: #10b981;
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        font-size: 0.875rem;
        margin-bottom: 1.25rem;
        border: 1px solid rgba(16,185,129,.2);
    }

    .login-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.875rem;
        color: var(--text-secondary);
    }

    .login-footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
    }

    .login-footer a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <svg class="sajf-logo-svg" width="52" height="52" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="5" width="90" height="90" rx="20" stroke="var(--logo-border)" stroke-width="2" fill="var(--logo-bg)"/>
                    <path d="M 27 45 L 35 23 L 45 45 Z" fill="var(--accent)"/>
                    <line x1="27" y1="45" x2="45" y2="45" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
                    <path d="M 15 78 L 35 23 L 60 78" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                    <path d="M 42 78 L 62 36 L 85 78" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                    <line x1="12" y1="78" x2="88" y2="78" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
                    <text x="21" y="91" fill="var(--logo-text-top)" font-family="'DM Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">S</text>
                    <text x="40" y="91" fill="var(--logo-text-top)" font-family="'DM Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">A</text>
                    <text x="60" y="91" fill="var(--logo-text-top)" font-family="'DM Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">J</text>
                    <text x="79" y="91" fill="var(--logo-text-top)" font-family="'DM Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">F</text>
                </svg>
            </div>
            <h1>Passwort ändern</h1>
            <p>Geben Sie Ihr aktuelles und neues Passwort ein</p>
        </div>

        <div id="message-container"></div>

        <div>
            <div class="form-group">
                <label class="form-label">Aktuelles Passwort</label>
                <input type="password" id="current_password" class="form-input" required
                       placeholder="••••••••" autocomplete="current-password">
            </div>

            <div class="form-group">
                <label class="form-label">Neues Passwort</label>
                <input type="password" id="new_password" class="form-input" required
                       placeholder="Min. 6 Zeichen" autocomplete="new-password"
                       oninput="checkStrength(this.value)">
                <div class="pw-strength"><div class="pw-strength-bar" id="strength-bar"></div></div>
                <div class="pw-strength-text" id="strength-text"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Neues Passwort bestätigen</label>
                <input type="password" id="confirm_password" class="form-input" required
                       placeholder="Passwort wiederholen" autocomplete="new-password">
            </div>

            <button type="button" class="btn-submit" id="submit-btn" onclick="handleChangePassword()">
                Passwort ändern
            </button>
        </div>

        <div class="login-footer">
            <a href="/publications">Zurück zu Ausschreibungen</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var submitBtn = document.getElementById('submit-btn');
    var messageContainer = document.getElementById('message-container');

    document.getElementById('confirm_password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleChangePassword();
    });

    function checkStrength(pw) {
        var bar = document.getElementById('strength-bar');
        var text = document.getElementById('strength-text');
        var score = 0;

        if (pw.length >= 6) score++;
        if (pw.length >= 10) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;

        var levels = [
            { width: '0%', color: '#27272a', label: '' },
            { width: '20%', color: '#ef4444', label: 'Sehr schwach' },
            { width: '40%', color: '#f59e0b', label: 'Schwach' },
            { width: '60%', color: '#f59e0b', label: 'Mittel' },
            { width: '80%', color: '#10b981', label: 'Stark' },
            { width: '100%', color: '#06b6d4', label: 'Sehr stark' }
        ];

        var level = levels[score] || levels[0];
        bar.style.width = level.width;
        bar.style.background = level.color;
        text.textContent = level.label;
        text.style.color = level.color;
    }

    function handleChangePassword() {
        var currentPw = document.getElementById('current_password').value;
        var newPw = document.getElementById('new_password').value;
        var confirmPw = document.getElementById('confirm_password').value;

        if (!currentPw || !newPw || !confirmPw) {
            showMessage('Bitte füllen Sie alle Felder aus.', 'error');
            return;
        }

        if (newPw.length < 6) {
            showMessage('Das neue Passwort muss mindestens 6 Zeichen lang sein.', 'error');
            return;
        }

        if (newPw !== confirmPw) {
            showMessage('Die Passwörter stimmen nicht überein.', 'error');
            return;
        }

        if (newPw === currentPw) {
            showMessage('Das neue Passwort muss sich vom aktuellen unterscheiden.', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Wird geändert...';

        fetch('/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                current_password: currentPw,
                new_password: newPw
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.success) {
                showMessage('Passwort erfolgreich geändert!', 'success');
                document.getElementById('current_password').value = '';
                document.getElementById('new_password').value = '';
                document.getElementById('confirm_password').value = '';
                checkStrength('');
            } else {
                showMessage(data.error || 'Passwort ändern fehlgeschlagen.', 'error');
            }
            submitBtn.disabled = false;
            submitBtn.textContent = 'Passwort ändern';
        })
        .catch(function(e) {
            showMessage('Verbindungsfehler. Bitte erneut versuchen.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Passwort ändern';
        });
    }

    function showMessage(msg, type) {
        messageContainer.innerHTML = '<div class="msg-' + type + '">' + msg + '</div>';
    }
</script>
{% endblock %}

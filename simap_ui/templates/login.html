{% extends "base.html" %}

{% block title %}Anmelden – SAJF Strategies{% endblock %}

{% block extra_css %}
<style>
    .auth-wrapper {
        min-height: calc(100vh - 56px - 160px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-3xl) var(--space-lg);
    }
    .auth-card {
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--space-2xl);
    }
    .auth-header {
        text-align: center;
        margin-bottom: var(--space-xl);
    }
    .auth-logo {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--text-primary);
        margin-bottom: var(--space-md);
    }
    .auth-header h1 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 4px;
        letter-spacing: -0.02em;
    }
    .auth-header p {
        color: var(--text-secondary);
        font-size: 0.88rem;
    }
    .auth-form-group {
        margin-bottom: var(--space-md);
    }
    .auth-label {
        display: block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 6px;
        color: var(--text-primary);
    }
    .auth-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 0.88rem;
        font-family: inherit;
        transition: border-color 150ms ease;
        background: var(--background);
        color: var(--text-primary);
    }
    .auth-input::placeholder { color: var(--text-muted); }
    .auth-input:focus {
        outline: none;
        border-color: var(--accent);
    }
    .auth-submit {
        width: 100%;
        margin-top: var(--space-sm);
    }
    .auth-footer {
        text-align: center;
        margin-top: var(--space-lg);
        font-size: 0.84rem;
        color: var(--text-secondary);
    }
    .auth-footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }
    .msg-error {
        background: var(--danger-light);
        color: var(--danger);
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        font-size: 0.84rem;
        margin-bottom: var(--space-md);
        border: 1px solid var(--danger);
    }
    .msg-success {
        background: var(--success-light);
        color: var(--success);
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        font-size: 0.84rem;
        margin-bottom: var(--space-md);
        border: 1px solid var(--success);
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">SAJF</div>
            <h1 data-i18n="auth_login_title">Willkommen zurück</h1>
            <p data-i18n="auth_login_sub">Melden Sie sich bei Ihrem Konto an</p>
        </div>

        <div id="message-container"></div>

        <div>
            <div class="auth-form-group">
                <label class="auth-label" for="email" data-i18n="auth_email">E-Mail-Adresse</label>
                <input type="email" id="email" class="auth-input" required
                       placeholder="name@unternehmen.ch" autocomplete="email">
            </div>

            <div class="auth-form-group">
                <label class="auth-label" for="password" data-i18n="auth_password">Passwort</label>
                <input type="password" id="password" class="auth-input" required
                       placeholder="Passwort eingeben" data-i18n-placeholder="auth_password_ph" autocomplete="current-password">
            </div>

            <button type="button" class="btn btn-primary auth-submit" id="submit-btn" onclick="handleLogin()" data-i18n="auth_login_btn">
                Anmelden
            </button>
        </div>

        <div class="auth-footer">
            <p><span data-i18n="auth_no_account">Noch kein Konto?</span> <a href="/register" data-i18n="auth_register_link">Jetzt registrieren</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var submitBtn = document.getElementById('submit-btn');
    var messageContainer = document.getElementById('message-container');

    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('email').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('password').focus();
    });

    function handleLogin() {
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;

        if (!email || !password) {
            showMessage('Bitte füllen Sie alle Felder aus.', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Anmeldung läuft...';

        fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.success) {
                var redirectUrl = data.redirect || '/publications';
                showMessage('Erfolgreich angemeldet! Weiterleitung...', 'success');
                setTimeout(function() { window.location.href = redirectUrl; }, 800);
            } else {
                showMessage(data.error || 'Anmeldung fehlgeschlagen.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Anmelden';
            }
        })
        .catch(function(e) {
            showMessage('Verbindungsfehler. Bitte erneut versuchen.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Anmelden';
        });
    }

    function showMessage(msg, type) {
        messageContainer.textContent = '';
        var el = document.createElement('div');
        el.className = 'msg-' + type;
        el.textContent = msg;
        messageContainer.appendChild(el);
    }
</script>
{% endblock %}

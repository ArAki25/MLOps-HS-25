{% extends "base.html" %}

{% block title %}Anmelden – SAJF Strategies{% endblock %}

{% block extra_css %}
<style>
    .login-wrapper {
        min-height: calc(100vh - 64px - 200px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        background: var(--background);
    }

    .login-card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        padding: 2.5rem;
        box-shadow: var(--shadow-lg);
    }

    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .login-logo {
        width: 52px;
        height: 52px;
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 1.25rem;
        font-family: 'Space Mono', monospace;
        margin: 0 auto 1.25rem;
    }

    .login-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 0.375rem;
        letter-spacing: -0.02em;
    }

    .login-header p {
        color: var(--text-secondary);
        font-size: 0.9375rem;
    }

    .form-group {
        margin-bottom: 1.25rem;
    }

    .form-label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 600;
        margin-bottom: 0.375rem;
        color: var(--text-primary);
    }

    .form-input {
        width: 100%;
        padding: 0.75rem 0.875rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 0.9375rem;
        font-family: inherit;
        transition: border-color 0.15s, box-shadow 0.15s;
        background: var(--background);
        color: var(--text-primary);
    }

    .form-input::placeholder { color: var(--text-muted); }

    .form-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        background: var(--surface);
    }

    .btn-submit {
        width: 100%;
        padding: 0.875rem;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: var(--radius);
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.15s;
        margin-top: 0.5rem;
    }

    .btn-submit:hover {
        background: var(--accent-hover);
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .btn-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    .login-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.875rem;
        color: var(--text-secondary);
    }

    .login-footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
    }

    .login-footer a:hover { text-decoration: underline; }

    .msg-error {
        background: #fef2f2;
        color: #dc2626;
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        font-size: 0.875rem;
        margin-bottom: 1.25rem;
        border: 1px solid #fecaca;
    }

    .msg-success {
        background: #f0fdf4;
        color: #059669;
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        font-size: 0.875rem;
        margin-bottom: 1.25rem;
        border: 1px solid #bbf7d0;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 1.5rem 0;
        color: var(--text-muted);
        font-size: 0.8125rem;
    }

    .divider::before, .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">S</div>
            <h1>Willkommen zurück</h1>
            <p>Melden Sie sich bei Ihrem Konto an</p>
        </div>

        <div id="message-container"></div>

        <div>
            <div class="form-group">
                <label class="form-label">E-Mail-Adresse</label>
                <input type="email" id="email" class="form-input" required 
                       placeholder="name@unternehmen.ch" autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label">Passwort</label>
                <input type="password" id="password" class="form-input" required 
                       placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="button" class="btn-submit" id="submit-btn" onclick="handleLogin()">
                Anmelden
            </button>
        </div>

        <div class="login-footer">
            <p>Noch kein Konto? <a href="/register">Jetzt registrieren</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const submitBtn = document.getElementById('submit-btn');
    const messageContainer = document.getElementById('message-container');

    // Allow Enter key
    document.getElementById('password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('email').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('password').focus();
    });

    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) {
            showMessage('Bitte füllen Sie alle Felder aus.', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Anmeldung läuft...';

        try {
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (data.success) {
                showMessage('Erfolgreich angemeldet! Weiterleitung...', 'success');
                setTimeout(() => { window.location.href = '/publications'; }, 800);
            } else {
                showMessage(data.error || 'Anmeldung fehlgeschlagen.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Anmelden';
            }
        } catch (e) {
            showMessage('Verbindungsfehler. Bitte erneut versuchen.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Anmelden';
        }
    }

    function showMessage(msg, type) {
        messageContainer.innerHTML = `<div class="msg-${type}">${msg}</div>`;
    }
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Admin Login – SAJF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: var(--background); }
        .admin-card {
            width: 100%; max-width: 380px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: var(--space-2xl);
        }
        .admin-card h1 {
            font-family: 'JetBrains Mono', monospace; font-size: 1.1rem;
            font-weight: 700; margin-bottom: var(--space-xl); color: var(--text-primary);
        }
        .admin-card h1 span { color: var(--accent); }
        label {
            display: block; font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.06em; margin-bottom: 5px; color: var(--text-secondary);
        }
        input[type=email], input[type=password] {
            width: 100%; padding: 10px 12px; margin-bottom: var(--space-md);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 0.88rem; font-family: inherit;
            background: var(--background); color: var(--text-primary);
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: var(--accent); }
        .btn-submit {
            width: 100%; padding: 10px; background: var(--accent); color: #fff;
            border: none; border-radius: var(--radius-sm); font-size: 0.88rem;
            font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .btn-submit:hover { opacity: 0.9; }
        .error {
            background: var(--danger-light); color: var(--danger);
            border: 1px solid var(--danger); border-radius: var(--radius-sm);
            padding: 9px 12px; font-size: 0.84rem; margin-bottom: var(--space-md);
        }
    </style>
</head>
<body>
    <div class="admin-card">
        <h1>SAJF <span>Admin</span></h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST" action="/admin/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>E-Mail</label>
            <input type="email" name="email" required autofocus placeholder="admin@sajf-strategies.ch">
            <label>Passwort</label>
            <input type="password" name="password" required placeholder="Passwort">
            <button type="submit" class="btn-submit">Anmelden</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SAJF - Publications</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="sidebar">
        <h2 style="color: white; margin-bottom: 40px;">SAJF</h2>
        <a href="/publications" class="nav-item active">📋 Publications</a>
        <a href="#" class="nav-item">🤖 AI Recommendations</a>
        <a href="#" class="nav-item">⭐ Favorites</a>
        <hr style="border: 0; border-top: 1px solid var(--sajf-card-border); margin: 20px 0;">
        <a href="#" class="nav-item">Settings</a>
    </div>

    <div style="margin-left: 260px; padding: 40px 60px; flex: 1;">
        <h1 style="font-size: 32px; margin-bottom: 40px;">Available AI-recommended turns</h1>

        <div class="search-box">
            <form action="/publications" method="GET" style="display: flex; gap: 15px;">
                <input type="text" name="search" class="search-input" placeholder="Search for keywords, project IDs..." value="{{ search }}">
                <button type="submit" class="btn-sajf">Search</button>
            </form>
        </div>

        <div class="results-list">
            {% for a in auftraege %}
            <div class="glass-card" style="padding: 24px; margin-bottom: 16px; display: grid; grid-template-columns: 1fr 200px 150px; gap: 20px; align-items: center;">
                <div>
                    <div style="font-weight: 700; font-size: 18px; color: var(--sajf-accent); margin-bottom: 6px;">{{ a.title_de }}</div>
                    <div style="font-size: 13px; color: var(--sajf-text-dim);">📍 {{ a.city }}, {{ a.canton }} | #{{ a.simap_project_id }}</div>
                </div>
                <div style="font-size: 14px; color: var(--sajf-text-dim);">{{ a.proc_office_name_de }}</div>
                <div style="text-align: right;">
                    <span style="display: block; font-weight: 600; color: white;">{{ a.pub_type|capitalize }}</span>
                    <span style="font-size: 12px; color: var(--sajf-text-dim);">{{ a.publication_date }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
